name: Bug Report
description: Report a problem with the MyListerHub plugin
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              We're sorry to hear you have a problem. Can you help us solve it by providing the following details.
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What did you ask, and what did you expect to happen?
          placeholder: I asked "Which of my listings are out of stock?" and it said it couldn't reach MyListerHub.
      validations:
          required: true
    - type: textarea
      id: how-to-reproduce
      attributes:
          label: How to reproduce the bug
          description: The prompts you used, the skill if any, and a reliable set of steps if possible.
          placeholder: When I do X I see Y.
      validations:
          required: true
    - type: input
      id: plugin-version
      attributes:
          label: Plugin Version
          description: The release you installed, from `/plugin` in Claude Code or the release you downloaded.
          placeholder: 1.0.0
      validations:
          required: true
    - type: dropdown
      id: client
      attributes:
          label: Where does it happen?
          description: You may select more than one.
          multiple: true
          options:
              - Claude Code
              - Claude (web or desktop)
              - ChatGPT
      validations:
          required: true
    - type: textarea
      id: notes
      attributes:
          label: Notes
          description: Use this field to provide any other notes that you feel might be relevant to the issue. Never include passwords or tokens.
      validations:
          required: false
